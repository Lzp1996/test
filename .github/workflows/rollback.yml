name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: '回滚目标（tag 名称、commit SHA 或 "last"）'
        required: false
        default: 'last'
        type: string
      skip-health-check:
        description: '跳过健康检查'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine rollback target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target }}"

          if [ "$TARGET" = "last" ]; then
            LAST_TAG=$(git tag -l "deploy-*" --sort=-version:refname | head -n 1)
            if [ -z "$LAST_TAG" ]; then
              echo "❌ No previous deployment tag found"
              exit 1
            fi
            TARGET_REF="$LAST_TAG"
            TARGET_COMMIT=$(git rev-list -n 1 "$LAST_TAG")
          elif git rev-parse "$TARGET" >/dev/null 2>&1; then
            TARGET_REF="$TARGET"
            TARGET_COMMIT=$(git rev-parse "$TARGET")
          else
            echo "❌ Invalid target: $TARGET"
            exit 1
          fi

          echo "target-ref=$TARGET_REF" >> $GITHUB_OUTPUT
          echo "target-commit=$TARGET_COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout target version
        run: git checkout "${{ steps.target.outputs.target-commit }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build from target version
        run: npm run build

      - name: Validate build
        run: test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Cancel blocking Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="${{ github.sha }}"
          for sha in $(git log --format=%H -n 10); do
            [ "$sha" = "$CURRENT" ] && continue
            status=$(gh api "repos/${{ github.repository }}/pages/deployments/${sha}" --jq '.status // empty' 2>/dev/null || true)
            case "$status" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
                echo "Cancelling blocking deployment ${sha:0:7} (status: $status)"
                gh api --method POST "repos/${{ github.repository }}/pages/deployments/${sha}/cancel" || true
                ;;
            esac
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 30
          reporting_interval: 10000

      - name: Health check
        if: ${{ !github.event.inputs.skip-health-check }}
        run: |
          sleep 15
          URL="${{ steps.deployment.outputs.page_url }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          test "$CODE" = "200"

      - name: Tag rollback deployment
        if: success()
        run: |
          TAG_NAME="rollback-$(date +%Y%m%d-%H%M%S)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG_NAME" -m "Rollback to ${{ steps.target.outputs.target-ref }}"
          git push origin "$TAG_NAME"
