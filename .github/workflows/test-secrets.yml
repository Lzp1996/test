name: Test Claude API Configuration

on:
  workflow_dispatch:

jobs:
  test-api-key:
    runs-on: ubuntu-latest

    steps:
      - name: Check API Key exists
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          echo "🔍 Checking Claude API configuration..."

          # 检查认证方式
          AUTH_METHOD=""
          if [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "✅ ANTHROPIC_AUTH_TOKEN is set (length: ${#ANTHROPIC_AUTH_TOKEN})"
            AUTH_METHOD="token"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✅ ANTHROPIC_API_KEY is set (length: ${#ANTHROPIC_API_KEY})"
            AUTH_METHOD="api_key"
          else
            echo "❌ Neither ANTHROPIC_AUTH_TOKEN nor ANTHROPIC_API_KEY is set"
            echo "Please add one of them in Settings → Secrets and variables → Actions"
            exit 1
          fi

          if [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "ℹ️  Using default Anthropic API: https://api.anthropic.com"
          else
            echo "✅ Using custom base URL: $ANTHROPIC_BASE_URL"
          fi

          echo "auth_method=$AUTH_METHOD" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          echo "📦 Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code

      - name: Verify Claude Code installation
        run: |
          echo "🔍 Verifying Claude Code installation..."
          claude --version
          echo "✅ Claude Code installed successfully"

      - name: Test Claude API connection
        id: api-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          echo "🔌 Testing Claude API connection..."

          BASE_URL="${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"

          # 根据认证方式选择不同的 header
          if [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then
            AUTH_HEADER="x-api-key: ${ANTHROPIC_AUTH_TOKEN}"
          else
            AUTH_HEADER="x-api-key: ${ANTHROPIC_API_KEY}"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BASE_URL}/v1/messages" \
            -H "$AUTH_HEADER" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{
              "model": "claude-sonnet-4-6",
              "max_tokens": 10,
              "messages": [{"role": "user", "content": "Hello"}]
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ API connection successful"
            echo "Response preview:"
            echo "$BODY" | jq -r '.content[0].text' || echo "$BODY"
          else
            echo "❌ API connection failed"
            echo "Response:"
            echo "$BODY"
            exit 1
          fi

      - name: Test result summary
        if: success()
        run: |
          echo ""
          echo "🎉 All tests passed!"
          echo ""
          echo "✅ Authentication configured (using ${{ steps.api-test.outputs.auth_method || 'token or api_key' }})"
          echo "✅ Claude Code CLI is installed"
          echo "✅ API connection is working"
          echo ""
          echo "You can now use the PR review workflow."
          echo "Next steps:"
          echo "1. Create the required labels (see SETUP.md)"
          echo "2. Create a test PR to verify the workflow"
