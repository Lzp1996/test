name: Deploy Vue to GitHub Pages

# 什么时候触发
on:
  push:
    branches: [master]   # push 到 master 分支时触发
  pull_request:
    types: [closed]      # PR 合并后触发
  workflow_dispatch:   # 允许在 GitHub 网页手动点「Run workflow」

# 权限：push gh-pages 分支部署
permissions:
  contents: write

# 只允许一个部署任务同时跑，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 检查是否允许自动部署
  check-approval:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
      - name: Check Auto-Deploy Approval
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const hasAutoDeployLabel = labels.some(label =>
              label.name === 'auto-deploy-approved'
            );

            const shouldDeploy = hasAutoDeployLabel || context.eventName === 'push';
            console.log(`Should deploy: ${shouldDeploy}`);
            core.setOutput('should-deploy', shouldDeploy);

            if (!shouldDeploy) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⏸️ 自动部署已跳过 - 此PR需要人工审核批准后才能部署'
              });
            }

  build-and-deploy:
    needs: [check-approval]
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.check-approval.outputs.should-deploy == 'true'))
    runs-on: ubuntu-latest   # 在 GitHub 提供的 Linux 虚拟机上跑
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/test/

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史以便回滚

      # 2. 获取上一次成功部署的信息
      - name: Get last successful deployment
        id: last-deploy
        run: |
          # 获取最后一个部署标签
          LAST_TAG=$(git tag -l "deploy-*" --sort=-version:refname | head -n 1)

          if [ -n "$LAST_TAG" ]; then
            echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT
            LAST_COMMIT=$(git rev-list -n 1 $LAST_TAG)
            echo "last-commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "📦 Last successful deployment: $LAST_TAG (commit: ${LAST_COMMIT:0:7})"
          else
            echo "last-tag=" >> $GITHUB_OUTPUT
            echo "last-commit=" >> $GITHUB_OUTPUT
            echo "ℹ️  No previous deployment found"
          fi

      # 3. 安装 Node.js
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 4. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 5. 构建
      - name: Build
        id: build
        run: |
          echo "🔨 Building application..."
          npm run build

          if [ $? -eq 0 ]; then
            echo "✅ Build successful"
            echo "build-success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed"
            echo "build-success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 6. 备份当前构建产物
      - name: Backup build artifacts
        if: steps.build.outputs.build-success == 'true'
        run: |
          echo "💾 Backing up build artifacts..."
          tar -czf /tmp/build-backup.tar.gz dist/
          echo "✅ Build artifacts backed up"

      # 7. 运行构建验证（可选）
      - name: Validate build
        if: steps.build.outputs.build-success == 'true'
        run: |
          echo "🔍 Validating build..."

          # 检查关键文件是否存在
          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in dist/"
            exit 1
          fi

          # 检查构建产物大小（防止空构建）
          BUILD_SIZE=$(du -sb dist/ | cut -f1)
          if [ "$BUILD_SIZE" -lt 1024 ]; then
            echo "❌ Build size too small: ${BUILD_SIZE} bytes"
            exit 1
          fi

          echo "✅ Build validation passed (size: ${BUILD_SIZE} bytes)"

      # 8. 部署到 GitHub Pages（git push，不走 Deployment API，避免 deployment_queued）
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.build.outputs.build-success == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"

      # 9. 检查部署状态
      - name: Check deployment status
        id: deploy-check
        run: |
          if [ "${{ steps.deployment.outcome }}" == "success" ]; then
            echo "✅ Deployment successful"
            echo "deploy-success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Deployment failed"
            echo "deploy-success=false" >> $GITHUB_OUTPUT
          fi

      # 10. 运行健康检查（可选）
      - name: Health check
        id: health-check
        if: steps.deploy-check.outputs.deploy-success == 'true'
        continue-on-error: true
        run: |
          echo "🏥 Running health check..."

          # 等待部署生效
          sleep 10

          # 获取部署 URL
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/test/"

          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️  Deploy URL not available, skipping health check"
            echo "health-success=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查页面是否可访问
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "000")

          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
            echo "health-success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            echo "health-success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 13. 创建部署标签（仅当部署和健康检查都成功）
      - name: Tag successful deployment
        if: |
          steps.deploy-check.outputs.deploy-success == 'true' &&
          steps.health-check.outputs.health-success == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="deploy-${TIMESTAMP}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

          git tag -a "$TAG_NAME" -m "Successful deployment at ${TIMESTAMP}"
          git push origin "$TAG_NAME"

          echo "✅ Created deployment tag: $TAG_NAME"

      # 14. 保存部署备份
      - name: Save deployment backup
        if: |
          steps.deploy-check.outputs.deploy-success == 'true' &&
          steps.health-check.outputs.health-success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-backup-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/build-backup.tar.gz
          retention-days: 7  # 减少存储时间

      # 15. 处理部署失败 - 自动回滚
      - name: Rollback on deployment failure
        if: |
          failure() &&
          steps.last-deploy.outputs.last-tag != ''
        run: |
          echo "🔄 Deployment failed, initiating rollback..."
          echo "Rolling back to: ${{ steps.last-deploy.outputs.last-tag }}"

          # 注意：GitHub Pages 的回滚需要重新部署上一个版本
          # 这里创建一个 workflow dispatch 事件来触发回滚
          echo "⚠️  Automatic rollback requires manual trigger"
          echo "Please run the 'Rollback Deployment' workflow"
          echo "Target: ${{ steps.last-deploy.outputs.last-tag }}"

      # 16. 部署结果通知
      - name: Deployment result notification
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploySuccess = '${{ steps.deploy-check.outputs.deploy-success }}' === 'true';
            const healthSuccess = '${{ steps.health-check.outputs.health-success }}' === 'true';
            const lastTag = '${{ steps.last-deploy.outputs.last-tag }}';

            let status = '';
            let emoji = '';
            let message = '';

            if (deploySuccess && healthSuccess) {
              status = '成功';
              emoji = '✅';
              message = '部署成功并通过健康检查';
            } else if (deploySuccess && !healthSuccess) {
              status = '警告';
              emoji = '⚠️';
              message = '部署成功但健康检查失败，建议回滚';
            } else {
              status = '失败';
              emoji = '❌';
              message = '部署失败';
              if (lastTag) {
                message += `，可以回滚到 ${lastTag}`;
              }
            }

            const body = `## ${emoji} 部署${status}

            **状态**: ${message}
            **Commit**: ${context.sha.substring(0, 7)}
            **部署 URL**: https://${{ github.repository_owner }}.github.io/test/

            ${!deploySuccess && lastTag ? `
            ### 🔄 回滚指南

            可以运行 \`Rollback Deployment\` workflow 回滚到上一个版本：
            - 标签: \`${lastTag}\`
            - Commit: \`${{ steps.last-deploy.outputs.last-commit }}\`
            ` : ''}
            `;

            // 如果是 PR 触发的，在 PR 中评论
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            console.log(body);

      # 17. 失败时退出
      - name: Fail workflow on deployment failure
        if: steps.deploy-check.outputs.deploy-success != 'true'
        run: |
          echo "❌ Workflow failed due to deployment failure"
          exit 1