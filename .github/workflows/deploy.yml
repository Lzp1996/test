name: Deploy Vue to GitHub Pages

# 单路径部署（避免 peaceiris + pages-build-deployment 双轨冲突）：
# - Pages 源必须设为：GitHub Actions（Settings → Pages → Source）
# - 本 workflow 负责 build → upload artifact → deploy-pages
# - 不再 push gh-pages 分支，避免触发卡死的 pages-build-deployment 循环

on:
  # 仅 workflow_dispatch，避免 push + 自动 dispatch + pages-build-deployment 并发导致 Deployment cancelled
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 不 cancel 进行中的 Pages 部署，避免 deployment 锁死
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get last successful deployment
        id: last-deploy
        run: |
          LAST_TAG=$(git tag -l "deploy-*" --sort=-version:refname | head -n 1)
          if [ -n "$LAST_TAG" ]; then
            echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "last-commit=$(git rev-list -n 1 $LAST_TAG)" >> $GITHUB_OUTPUT
          else
            echo "last-tag=" >> $GITHUB_OUTPUT
            echo "last-commit=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate build
        run: |
          test -f dist/index.html
          test "$(du -sb dist/ | cut -f1)" -ge 1024

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Pages API 同时只允许一个 deployment；取消近期 commit 上卡住的 in-progress 部署
      - name: Cancel blocking Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="${{ github.sha }}"
          for sha in $(git log --format=%H -n 10); do
            [ "$sha" = "$CURRENT" ] && continue
            status=$(gh api "repos/${{ github.repository }}/pages/deployments/${sha}" --jq '.status // empty' 2>/dev/null || true)
            case "$status" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
                echo "Cancelling blocking deployment ${sha:0:7} (status: $status)"
                gh api --method POST "repos/${{ github.repository }}/pages/deployments/${sha}/cancel" || true
                ;;
            esac
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 30
          reporting_interval: 10000

      - name: Health check
        continue-on-error: true
        run: |
          sleep 15
          URL="${{ steps.deployment.outputs.page_url }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          test "$CODE" = "200"

      - name: Tag successful deployment
        if: success()
        run: |
          TAG_NAME="deploy-$(date +%Y%m%d-%H%M%S)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG_NAME" -m "Successful deployment at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$TAG_NAME"
