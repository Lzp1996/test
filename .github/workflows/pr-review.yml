name: PR Code Review with Claude

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

# 并发控制：确保同一个 PR 分支不会有多个 workflow 同时运行
concurrency:
  group: pr-review-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false  # 不取消正在运行的，而是排队等待

# 权限：部署 Pages 需要
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-skip-review:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
      skip-reason: ${{ steps.check.outputs.skip-reason }}

    steps:
      - name: Check if should skip Claude review
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prTitle = context.payload.pull_request.title;
            const prNumber = context.payload.pull_request.number;

            // 检查 PR 标题中的跳过标签
            const titleTags = ['[skip-review]', '[deploy-direct]', '[trusted]'];
            const hasTitleTag = titleTags.some(tag => prTitle.includes(tag));

            // 检查 PR 标签
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const skipLabels = ['skip-claude-review', 'skip-review', 'auto-merge-approved'];
            const hasSkipLabel = labels.some(label => skipLabels.includes(label.name));

            // 判断是否跳过
            const shouldSkip = hasTitleTag || hasSkipLabel;

            let skipReason = '';
            if (hasTitleTag) {
              const matchedTag = titleTags.find(tag => prTitle.includes(tag));
              skipReason = `PR 标题包含跳过标签: ${matchedTag}`;
            } else if (hasSkipLabel) {
              const matchedLabel = labels.find(label => skipLabels.includes(label.name));
              skipReason = `PR 包含跳过标签: ${matchedLabel.name}`;
            }

            console.log(`Should skip review: ${shouldSkip}`);
            console.log(`Reason: ${skipReason}`);

            core.setOutput('should-skip', shouldSkip);
            core.setOutput('skip-reason', skipReason);

            // 如果跳过，添加评论说明
            if (shouldSkip) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## ⏭️ 跳过 Claude 审查\n\n**原因**: ${skipReason}\n\n**注意**: 此 PR 已跳过自动代码审查，请确保：\n- ✅ 代码已经过人工审查\n- ✅ 测试已通过\n- ✅ 变更风险可控\n\n此 PR 将直接进入自动合并流程。`
              });
            }

  claude-review:
    needs: check-skip-review
    if: needs.check-skip-review.outputs.should-skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      review-passed: ${{ steps.review-result.outputs.passed }}
      risk-level: ${{ steps.review-result.outputs.risk }}
      can-auto-fix: ${{ steps.review-result.outputs.can-fix }}
      needs-human: ${{ steps.review-result.outputs.needs-human }}

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch base branch for diff
        run: git fetch origin "${{ github.base_ref }}"

      - name: Configure Claude environment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
        run: |
          echo "Claude Code version:"
          claude --version
          echo "Setting up Claude environment..."

          # 检查认证方式
          if [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "✅ Using ANTHROPIC_AUTH_TOKEN"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✅ Using ANTHROPIC_API_KEY"
          else
            echo "❌ No authentication configured"
            exit 1
          fi

      - name: Run Claude Code Review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # 生成 diff 信息（使用唯一文件名）
          TMP_PREFIX="/tmp/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}"
          git diff origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }} > ${TMP_PREFIX}-pr-diff.txt

          # 运行 Claude Code headless 审查
          bash .github/scripts/claude-review.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.title }}" \
            "${{ github.event.pull_request.user.login }}" \
            "${TMP_PREFIX}-pr-diff.txt"

      - name: Parse Review Result
        id: review-result
        run: |
          if [ ! -s /tmp/claude-review-result.json ]; then
            echo "❌ Review result file is missing or empty"
            exit 1
          fi

          if ! jq empty /tmp/claude-review-result.json 2>/dev/null; then
            echo "❌ Review result is not valid JSON"
            cat /tmp/claude-review-result.json
            exit 1
          fi

          cp /tmp/claude-review-result.json /tmp/review-summary.json

          echo "passed=$(jq -r '.passed' /tmp/review-summary.json)" >> $GITHUB_OUTPUT
          echo "risk=$(jq -r '.risk_level' /tmp/review-summary.json)" >> $GITHUB_OUTPUT
          echo "can-fix=$(jq -r '.can_auto_fix' /tmp/review-summary.json)" >> $GITHUB_OUTPUT
          echo "needs-human=$(jq -r '.needs_human_review' /tmp/review-summary.json)" >> $GITHUB_OUTPUT

      - name: Comment Review Result on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/review-summary.json', 'utf8').trim();
            if (!raw) {
              throw new Error('Review summary is empty. Claude review did not produce a result.');
            }
            const result = JSON.parse(raw);

            const riskEmoji = {
              'low': '🟢',
              'medium': '🟡',
              'high': '🔴'
            };

            const body = `## 🤖 Claude Code 自动审查结果

            **审查状态**: ${result.passed ? '✅ 通过' : '❌ 未通过'}
            **风险级别**: ${riskEmoji[result.risk_level]} ${result.risk_level.toUpperCase()}
            **可自动修复**: ${result.can_auto_fix ? '✅ 是' : '❌ 否'}
            **需要人工审核**: ${result.needs_human_review ? '⚠️ 是' : '✅ 否'}

            ### 📋 问题描述
            ${result.issues.map(issue => `- ${issue}`).join('\n')}

            ### 🔧 修复建议
            ${result.suggestions.map(s => `- ${s}`).join('\n')}

            ### 📊 变更统计
            - 文件数: ${result.files_changed}
            - 添加行数: +${result.lines_added}
            - 删除行数: -${result.lines_deleted}

            ---
            **自动化决策**: ${result.auto_decision}
            ${result.max_fix_attempts > 0 ? `**最大修复次数**: ${result.max_fix_attempts}` : ''}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload Review Result
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-result-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: /tmp/review-summary.json
          retention-days: 7  # 减少存储时间

  auto-fix:
    needs: [check-skip-review, claude-review]
    if: |
      needs.check-skip-review.outputs.should-skip == 'false' &&
      needs.claude-review.outputs.review-passed == 'false' &&
      needs.claude-review.outputs.can-auto-fix == 'true' &&
      needs.claude-review.outputs.needs-human == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Download Review Result
        uses: actions/download-artifact@v4
        with:
          name: claude-review-result-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: /tmp

      - name: Auto Fix Issues
        id: auto-fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          bash .github/scripts/claude-fix.sh \
            "/tmp/review-summary.json" \
            "${{ github.event.pull_request.number }}"

      - name: Commit and Push Fixes
        if: steps.auto-fix.outputs.fixed == 'true'
        run: |
          # 获取远程最新状态
          git fetch origin ${{ github.event.pull_request.head.ref }}

          # 检查远程是否有新的提交
          LOCAL_COMMIT=$(git rev-parse HEAD)
          REMOTE_COMMIT=$(git rev-parse origin/${{ github.event.pull_request.head.ref }})

          if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
            echo "⚠️ Remote branch has new commits, attempting rebase..."

            # 暂存当前修改
            git stash push -m "Claude auto-fix changes"

            # 拉取远程更改
            git pull --rebase origin ${{ github.event.pull_request.head.ref }}

            # 应用暂存的修改
            if git stash pop; then
              echo "✅ Rebase successful, changes applied"
            else
              echo "❌ Rebase conflict detected, aborting auto-fix"
              git rebase --abort
              git stash drop
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          # 提交修复
          git config --local user.email "claude-bot@github.actions"
          git config --local user.name "Claude Bot"
          git add .
          git commit -m "🤖 Claude auto-fix: $(cat /tmp/fix-summary.txt)"

          # 推送时再次检查
          if git push origin HEAD:${{ github.event.pull_request.head.ref }}; then
            echo "✅ Push successful"
          else
            echo "❌ Push failed, likely due to concurrent changes"
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Comment Fix Result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const fixed = '${{ steps.auto-fix.outputs.fixed }}' === 'true';
            const conflict = '${{ steps.auto-fix.outputs.conflict }}' === 'true';

            let body;
            if (conflict) {
              body = `## ⚠️ 自动修复冲突\n\n在推送修复时检测到远程分支有新的提交，无法自动应用修复。\n\n**原因**: 可能有其他提交被推送到了同一分支。\n\n**建议**: 请手动解决冲突或重新触发审查流程。`;
            } else if (fixed) {
              body = `## 🔧 Claude 自动修复完成\n\n已自动修复代码问题并提交，请重新触发审查流程。\n\n修复内容:\n${fs.readFileSync('/tmp/fix-summary.txt', 'utf8')}`;
            } else {
              body = `## ⚠️ 自动修复失败\n\n无法自动修复问题，需要人工介入。`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  decision:
    needs: [check-skip-review, claude-review]
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Make Deployment Decision
        id: make-decision
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shouldSkip = '${{ needs.check-skip-review.outputs.should-skip }}' === 'true';
            const skipReason = '${{ needs.check-skip-review.outputs.skip-reason }}';

            let decision = '';
            let label = '';
            let autoMerge = false;

            // 如果跳过审查，直接批准自动部署
            if (shouldSkip) {
              decision = `✅ **跳过审查 - 自动部署**: ${skipReason}`;
              label = 'auto-deploy-approved';
              autoMerge = true;
            } else {
              // 正常审查流程
              const passed = '${{ needs.claude-review.outputs.review-passed }}' === 'true';
              const risk = '${{ needs.claude-review.outputs.risk-level }}';
              const needsHuman = '${{ needs.claude-review.outputs.needs-human }}' === 'true';

              if (passed && risk === 'low' && !needsHuman) {
                decision = '✅ **自动部署**: 低风险变更，审查通过，将自动合并并部署';
                label = 'auto-deploy-approved';
                autoMerge = true;
              } else if (passed && risk === 'medium') {
                decision = '⚠️ **需要确认**: 中等风险变更，请人工确认后合并';
                label = 'needs-human-approval';
              } else if (risk === 'high' || needsHuman) {
                decision = '🔴 **必须人工审核**: 高风险变更或复杂修改，需要详细审查';
                label = 'needs-human-review';
              } else {
                decision = '❌ **审查未通过**: 代码存在问题，请修复后重新提交';
                label = 'review-failed';
              }
            }

            // 添加标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

            // 评论决策结果
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🎯 部署决策\n\n${decision}`
            });

            core.setOutput('auto-merge', autoMerge);
            core.setOutput('label', label);

      - name: Auto-merge PR (low risk only)
        if: steps.make-decision.outputs.auto-merge == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // 检查 PR 状态
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });

              // 检查是否可以合并
              if (!pr.mergeable) {
                console.log('❌ PR has conflicts, cannot auto-merge');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: '⚠️ PR 有冲突，无法自动合并，请手动解决冲突后重新提交。'
                });
                return;
              }

              // 检查是否有必需的检查通过
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });

              // 自动合并
              console.log('✅ Auto-merging PR...');
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash', // 或 'merge' 或 'rebase'
                commit_title: `${pr.title} (#${context.issue.number})`,
                commit_message: `Auto-merged by Claude Code automation\n\n${pr.body || ''}\n\nCo-Authored-By: Claude Bot <claude-bot@github.actions>`
              });

              console.log('✅ PR merged successfully');

              // 评论成功信息
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ✅ 自动合并成功\n\n低风险变更已自动合并，部署流程将自动触发。\n\n📊 **审查摘要**:\n- 风险级别: 🟢 Low\n- 审查状态: ✅ Passed\n- 合并方式: Squash and merge\n\n部署完成后会自动通知。`
              });

            } catch (error) {
              console.error('❌ Auto-merge failed:', error.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ⚠️ 自动合并失败\n\n自动合并时发生错误，请手动合并 PR。\n\n错误信息: ${error.message}`
              });

              // 移除自动部署标签，改为需要人工确认
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'auto-deploy-approved'
              }).catch(() => {});

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-human-approval']
              });
            }
